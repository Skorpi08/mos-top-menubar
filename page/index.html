<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Bar Navigation Controller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        .card {
            background: #313244;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { font-size: 20px; color: #a6e3a1; margin-top: 0; }
        p { font-size: 14px; color: #bac2de; line-height: 1.5; }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #a6e3a1;
            color: #11111b;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Top Bar Navigation</h1>
    <div class="status">Aktiviert</div>
    <p>Dieses Plugin hat die MOS-Menüleiste erfolgreich an das obere Ende des Bildschirms fixiert.</p>
    <p>Sollte sich das Layout verschieben, kannst du das Plugin im MOS Hub einfach deinstallieren, um das Standarddesign wiederherzustellen.</p>
</div>

</body>
</html>
