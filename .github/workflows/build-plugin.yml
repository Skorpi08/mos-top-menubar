name: Build MOS plugin

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Plugin release version, for example 1.0.12
        required: true
        default: 1.0.12

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Vue federation remote
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run build

      - name: Build Debian plugin package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE="top-menubar-${VERSION}-1+mos-plugin"
          PACKAGE_DIR="${PACKAGE}_all"
          DEB_FILE="${PACKAGE}_all.deb"

          test -f page/dist/top-menubar/remoteEntry.js
          test -f page/dist/top-menubar/manifest.json

          mkdir -p "$PACKAGE_DIR/var/www/mos-plugins/top-menubar"
          mkdir -p "$PACKAGE_DIR/DEBIAN"
          cp -R page/dist/top-menubar/. "$PACKAGE_DIR/var/www/mos-plugins/top-menubar/"

          cat > "$PACKAGE_DIR/DEBIAN/control" <<EOF
          Package: mos-top-menubar-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: all
          Maintainer: Skorpi08
          Description: MOS horizontal top navigation plugin
          EOF

          dpkg-deb --build "$PACKAGE_DIR" "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE" | grep -q './var/www/mos-plugins/top-menubar/manifest.json'
          if dpkg-deb --contents "$DEB_FILE" | grep -q './boot/'; then
            echo "ERROR: plugin package must not write to /boot"
            exit 1
          fi
          md5sum "$DEB_FILE" | awk '{print $1}' > "$DEB_FILE.md5"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Top Menu Bar ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            top-menubar-${{ steps.version.outputs.version }}-1+mos-plugin_all.deb
            top-menubar-${{ steps.version.outputs.version }}-1+mos-plugin_all.deb.md5